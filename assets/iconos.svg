<!-- Biblioteca de íconos de red propia del curso Seguridad en Redes (CUC).
     Dibujo original, libre para uso en el curso. Trazo = currentColor (definir color con style="color:...").
     Uso dentro de un SVG de diagrama:  <use href="#i-router" x="100" y="40" width="64" height="64" style="color:#A6192E"/>  -->
<defs>
<style>.ic{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.icf{fill:currentColor;stroke:none}.icw{fill:#fff;stroke:currentColor;stroke-width:3;stroke-linejoin:round}</style>
